<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="50%" stop-color="#071022" />
      <stop offset="100%" stop-color="#02050c" />
    </linearGradient>

    <!-- Glowing Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a3ff" />
      <stop offset="50%" stop-color="#00d8ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <!-- Orange/Amber Gradient (Left Side) -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb700" />
      <stop offset="100%" stop-color="#ff8000" />
    </linearGradient>

    <!-- Cyan/Blue Gradient (Right Side) -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>

    <!-- Center Spine Glow -->
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="50%" stop-color="#00d8ff" />
      <stop offset="100%" stop-color="#0099ff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer App Icon Container (Squircle) -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <!-- Glowing Border Frame -->
  <rect x="10" y="10" width="492" height="492" rx="90" fill="none" stroke="url(#borderGrad)" stroke-width="10" filter="url(#glowEffect)" opacity="0.9" />

  <!-- Ambient Glow Behind Center Emblem -->
  <circle cx="256" cy="210" r="150" fill="#00d8ff" opacity="0.1" filter="url(#strongGlow)" />
  <circle cx="190" cy="210" r="110" fill="#ff8000" opacity="0.08" filter="url(#strongGlow)" />

  <!-- CENTRAL EMBLEM: HEAD PROFILE + OPEN BOOK + CIRCUITS -->
  <g transform="translate(0, -10)">
    
    <!-- Outer Head Silhouette Contour -->
    <!-- Left Contour (Orange Circuit Head) -->
    <path d="M 256 65 C 175 65, 148 115, 148 168 C 148 208, 156 242, 156 282 C 156 312, 180 328, 202 333 L 202 365" 
          fill="none" stroke="url(#orangeGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowEffect)" />
    
    <!-- Right Contour (Cyan Circuit Head Profile with Forehead, Nose, Lips, Chin) -->
    <path d="M 256 65 C 335 65, 360 108, 365 148 C 380 158, 390 178, 365 208 C 370 218, 375 228, 365 238 C 357 246, 370 258, 355 273 C 347 288, 340 318, 298 365" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowEffect)" />

    <!-- External Circuit Traces & Nodes - Left Side (Orange) -->
    <g stroke="url(#orangeGrad)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glowEffect)">
      <path d="M 152 82 L 95 82 L 68 82" />
      <circle cx="68" cy="82" r="7" fill="#ffb700" stroke="none" />

      <path d="M 132 120 L 132 120" />
      <circle cx="132" cy="120" r="7" fill="#ff8000" stroke="none" />

      <path d="M 148 168 L 88 168 L 38 168" />
      <circle cx="38" cy="168" r="8" fill="#ffb700" stroke="none" />

      <path d="M 155 240 L 142 240 L 115 280 L 65 280" />
      <circle cx="65" cy="280" r="7" fill="#ff8000" stroke="none" />

      <path d="M 155 298 L 142 298 L 122 350 L 65 350" />
      <circle cx="65" cy="350" r="7" fill="#ffb700" stroke="none" />

      <path d="M 202 333 L 202 365 L 202 400" />
      <circle cx="202" cy="400" r="6" fill="#ff8000" stroke="none" />
    </g>

    <!-- External Circuit Traces & Nodes - Right Side (Cyan) -->
    <g stroke="url(#cyanGrad)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glowEffect)">
      <path d="M 360 78 L 385 78 L 422 78" />
      <circle cx="422" cy="78" r="6" fill="#00f0ff" stroke="none" />

      <path d="M 362 98 L 378 98 L 398 132 L 430 132" />
      <circle cx="430" cy="132" r="7" fill="#00d8ff" stroke="none" />

      <path d="M 372 168 L 398 168 L 428 168" />
      <circle cx="428" cy="168" r="8" fill="#00ffff" stroke="none" />

      <path d="M 350 218 L 395 218" />
      <circle cx="395" cy="218" r="6" fill="#00a3ff" stroke="none" />

      <path d="M 365 268 L 400 268" />
      <circle cx="400" cy="268" r="6" fill="#00ffff" stroke="none" />

      <path d="M 358 302 L 450 302" />
      <circle cx="450" cy="302" r="7" fill="#0088ff" stroke="none" />

      <path d="M 298 365 L 298 400" />
      <circle cx="298" cy="400" r="6" fill="#00f0ff" stroke="none" />
    </g>

    <!-- CENTER OPEN BOOK EMBLEM -->
    <!-- Left Book Page (Orange) -->
    <path d="M 248 148 Q 198 130 160 152 Q 160 248 160 282 Q 198 256 248 274 Z" 
          fill="url(#orangeGrad)" opacity="0.88" stroke="#ffb700" stroke-width="3" filter="url(#glowEffect)" />
    <!-- Left Page Circuit Branches inside book -->
    <path d="M 178 195 L 210 195 M 192 175 L 192 235 M 218 180 L 232 205" stroke="#000000" opacity="0.3" stroke-width="3" stroke-linecap="round" />
    <circle cx="210" cy="195" r="4" fill="#ffb700" />
    <circle cx="192" cy="175" r="4" fill="#ffffff" />

    <!-- Right Book Page (Cyan) -->
    <path d="M 264 148 Q 314 130 352 152 Q 352 248 352 282 Q 314 256 264 274 Z" 
          fill="url(#cyanGrad)" opacity="0.88" stroke="#00ffff" stroke-width="3" filter="url(#glowEffect)" />
    <!-- Right Page Circuit Branches inside book -->
    <path d="M 280 205 L 322 205 M 300 170 L 300 228 M 310 185 L 330 210" stroke="#002b4d" opacity="0.4" stroke-width="3" stroke-linecap="round" />
    <circle cx="310" cy="185" r="5" fill="#00ffff" />
    <circle cx="280" cy="205" r="4" fill="#ffffff" />

    <!-- Center Glowing Vertical Book Spine -->
    <rect x="248" y="140" width="16" height="142" rx="8" fill="url(#spineGrad)" filter="url(#strongGlow)" />
    <rect x="252" y="143" width="8" height="136" rx="4" fill="#ffffff" />

  </g>

  <!-- BRAND NAME TYPOGRAPHY: EduNexus -->
  <g transform="translate(256, 442)">
    <!-- Text Shadow / Glow -->
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="62" letter-spacing="-1" opacity="0.5" filter="url(#glowEffect)">
      <tspan fill="#ffffff">Edu</tspan>
      <tspan fill="#00d8ff">Nexus</tspan>
    </text>
    <!-- Main Crisp Text -->
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="62" letter-spacing="-1">
      <tspan fill="#ffffff">Edu</tspan>
      <tspan fill="#00d8ff">Nexus</tspan>
    </text>
  </g>
</svg>
