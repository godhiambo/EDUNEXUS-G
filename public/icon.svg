<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Core Background Gradients -->
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b172a" />
      <stop offset="50%" stop-color="#080e1c" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <!-- Metallic Frame Gradient -->
    <linearGradient id="metalFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="25%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="75%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <linearGradient id="innerMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glow/Tech Gradients -->
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <linearGradient id="copperGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>

    <linearGradient id="bulbGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows and Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Icon Card Squircle -->
  <rect width="512" height="512" rx="110" fill="url(#mainBg)" />
  
  <!-- Ambient Center Glow -->
  <circle cx="256" cy="240" r="180" fill="url(#centerGlow)" />

  <!-- Outer Metallic Border Structure (Matches uploaded image exactly) -->
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="url(#metalFrame)" stroke-width="8" opacity="0.9" />
  <rect x="22" y="22" width="468" height="468" rx="88" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.4" />
  
  <!-- Corner Tech Details on Outer Frame -->
  <path d="M 60 12 L 120 12" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
  <path d="M 392 12 L 452 12" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
  <path d="M 12 60 L 12 120" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
  <path d="M 12 392 L 12 452" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
  <path d="M 500 60 L 500 120" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
  <path d="M 500 392 L 500 452" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />

  <!-- Background Printed Circuit Board (PCB) Traces -->
  <g opacity="0.22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Copper Left-side Circuit paths -->
    <g stroke="url(#copperGlow)" stroke-width="2" fill="none">
      <path d="M 40 180 L 120 180 L 150 210" />
      <circle cx="40" cy="180" r="4" fill="url(#copperGlow)" />
      <circle cx="150" cy="210" r="3" fill="url(#copperGlow)" />
      
      <path d="M 80 80 L 140 80 L 180 120" />
      <circle cx="80" cy="80" r="4" fill="url(#copperGlow)" />
      
      <path d="M 60 380 L 130 380 L 170 340 L 170 300" />
      <circle cx="60" cy="380" r="4" fill="url(#copperGlow)" />

      <path d="M 110 440 L 160 440 L 200 400" />
    </g>

    <!-- Cyan Right-side Circuit paths -->
    <g stroke="url(#tealGlow)" stroke-width="2" fill="none">
      <path d="M 472 180 L 392 180 L 362 210" />
      <circle cx="472" cy="180" r="4" fill="url(#tealGlow)" />
      <circle cx="362" cy="210" r="3" fill="url(#tealGlow)" />
      
      <path d="M 432 80 L 372 80 L 332 120" />
      <circle cx="432" cy="80" r="4" fill="url(#tealGlow)" />
      
      <path d="M 452 380 L 382 380 L 342 340 L 342 300" />
      <circle cx="452" cy="380" r="4" fill="url(#tealGlow)" />

      <path d="M 402 440 L 352 440 L 312 400" />
    </g>
  </g>

  <!-- Central Lightbulb & Cognitive Concept Representation -->
  <g transform="translate(0, -10)">
    <!-- Lightbulb Base (Screw threads - modern tech design) -->
    <g transform="translate(196, 360)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 15 10 L 105 10" stroke="url(#tealGlow)" stroke-width="8" filter="url(#glow)" />
      <path d="M 22 24 L 98 24" stroke="url(#tealGlow)" stroke-width="8" />
      <path d="M 30 38 L 90 38" stroke="url(#tealGlow)" stroke-width="8" />
      <!-- Base Contact -->
      <path d="M 42 48 L 78 48 Q 60 62 42 48" fill="#1e3a8a" stroke="url(#tealGlow)" stroke-width="3" />
    </g>

    <!-- Lightbulb Outlines & Glass Glow -->
    <!-- Left Half Glass (Amber/Orange) -->
    <path d="M 256 90 Q 150 90 150 230 Q 150 310 211 340 L 211 360" fill="none" stroke="url(#copperGlow)" stroke-width="4" stroke-dasharray="8 4" opacity="0.6" />
    <!-- Right Half Glass (Cyan/Teal) -->
    <path d="M 256 90 Q 362 90 362 230 Q 362 310 301 340 L 301 360" fill="none" stroke="url(#tealGlow)" stroke-width="4" opacity="0.8" filter="url(#glow)" />

    <!-- CENTRAL GRAPHIC: DUAL BRAIN-BOOK AND BULB CORE -->
    
    <!-- Left Side: Educational Pedagogy / Book of Code & Knowledge -->
    <!-- Open Book Leaf - Left -->
    <path d="M 250 180 C 205 170, 180 185, 170 210 L 170 300 C 180 280, 210 270, 250 280 Z" fill="#101e38" stroke="url(#copperGlow)" stroke-width="4" />
    <path d="M 240 195 C 208 188, 192 198, 185 215 L 185 285 C 192 272, 210 265, 240 271 Z" fill="#fdba74" opacity="0.85" />
    
    <!-- Vertical Book Spine -->
    <rect x="247" y="165" width="18" height="150" rx="9" fill="url(#tealGlow)" filter="url(#glow)" />
    <rect x="252" y="170" width="8" height="140" rx="4" fill="#ffffff" />

    <!-- Binary Code Streams & Knowledge nodes rising from book (Left half) -->
    <g fill="url(#copperGlow)" font-family="monospace" font-size="12" font-weight="bold" opacity="0.8" transform="translate(130, 120)">
      <text x="50" y="20">1</text>
      <text x="35" y="40">0</text>
      <text x="65" y="45">1</text>
      <text x="40" y="70">0</text>
      <text x="55" y="90">1</text>
      <text x="30" y="110">1</text>
      <text x="60" y="125">0</text>
      <text x="45" y="150">1</text>
      <text x="75" y="165">0</text>
    </g>

    <!-- DNA Strand / Curriculum helix rising from bottom of book (Left center) -->
    <g stroke="url(#copperGlow)" stroke-width="2" fill="none" opacity="0.7">
      <path d="M 230 310 Q 220 290 230 270 T 230 230 T 230 190" />
      <path d="M 220 310 Q 230 290 220 270 T 220 230 T 220 190" />
      <line x1="223" y1="298" x2="227" y2="298" />
      <line x1="221" y1="280" x2="229" y2="280" />
      <line x1="223" y1="258" x2="227" y2="258" />
      <line x1="221" y1="240" x2="229" y2="240" />
      <line x1="223" y1="218" x2="227" y2="218" />
      <line x1="221" y1="200" x2="229" y2="200" />
    </g>

    <!-- Right Side: AI Synapse Neural Network (Instructional Technology & Intelligence) -->
    <!-- Open Book Leaf - Right (Representing Neural Blueprint) -->
    <path d="M 262 180 C 307 170, 332 185, 342 210 L 342 300 C 332 280, 303 270, 262 280 Z" fill="#082f49" stroke="url(#tealGlow)" stroke-width="4" filter="url(#glow)" />
    
    <!-- Neural Network Nodes & Connections layered over right page -->
    <g opacity="0.95">
      <!-- Synapse Links (Connecting lines) -->
      <g stroke="#22d3ee" stroke-width="1.5" opacity="0.6">
        <line x1="262" y1="185" x2="290" y2="160" />
        <line x1="290" y1="160" x2="330" y2="175" />
        <line x1="330" y1="175" x2="340" y2="220" />
        <line x1="340" y1="220" x2="310" y2="250" />
        <line x1="310" y1="250" x2="270" y2="235" />
        <line x1="270" y1="235" x2="262" y2="185" />
        
        <!-- Cross Connections -->
        <line x1="290" y1="160" x2="310" y2="250" stroke="#ffffff" stroke-width="1" />
        <line x1="270" y1="235" x2="330" y2="175" />
        <line x1="270" y1="235" x2="295" y2="200" />
        <line x1="310" y1="250" x2="295" y2="200" />
        <line x1="330" y1="175" x2="295" y2="200" />
        <line x1="290" y1="160" x2="295" y2="200" />

        <!-- Sub-branches branching outside glass -->
        <line x1="330" y1="175" x2="380" y2="150" stroke-width="2.5" />
        <line x1="340" y1="220" x2="395" y2="230" stroke-width="2.5" />
        <line x1="310" y1="250" x2="365" y2="295" stroke-width="2.5" />
      </g>
      
      <!-- Glowing Synapse Nodes (Circles) -->
      <circle cx="262" cy="185" r="5" fill="#ffffff" stroke="url(#tealGlow)" stroke-width="2" />
      <circle cx="290" cy="160" r="6" fill="#22d3ee" filter="url(#glow)" />
      <circle cx="330" cy="175" r="7" fill="#ffffff" stroke="url(#tealGlow)" stroke-width="2.5" filter="url(#glow)" />
      <circle cx="340" cy="220" r="6" fill="#22d3ee" />
      <circle cx="310" cy="250" r="8" fill="#ffffff" stroke="url(#tealGlow)" stroke-width="3" filter="url(#glow)" />
      <circle cx="270" cy="235" r="5" fill="#22d3ee" />
      <circle cx="295" cy="200" r="4" fill="#ffffff" />

      <!-- Nodes reaching outside bulb frame -->
      <circle cx="380" cy="150" r="8" fill="#22d3ee" filter="url(#intenseGlow)" />
      <circle cx="395" cy="230" r="6" fill="#ffffff" stroke="url(#tealGlow)" stroke-width="2" filter="url(#glow)" />
      <circle cx="365" cy="295" r="8" fill="#22d3ee" filter="url(#intenseGlow)" />
    </g>

    <!-- Small Sparkles / Light bursts around neural network -->
    <path d="M 370 110 Q 380 110 380 100 Q 380 110 390 110 Q 380 110 380 120 Q 380 110 370 110" fill="#ffffff" opacity="0.9" />
    <path d="M 140 140 Q 150 140 150 130 Q 150 140 160 140 Q 150 140 150 150 Q 150 140 140 140" fill="#fdba74" opacity="0.8" />
  </g>
</svg>
